{% load static %}

<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            LinkUp
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>
    

<header class="header">

    <a href="{% url 'home' %}" class="logo">
        LinkUp
    </a>

    <nav>

        {% if user.is_authenticated %}

            <a href="{% url 'profile' %}">
                Профіль
            </a>

            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-link">Вийти</button>
            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Увійти
            </a>

            <a href="{% url 'register' %}">
                Реєстрація
            </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


</body>
</html>
