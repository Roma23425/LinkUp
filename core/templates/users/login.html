{% extends "base.html" %}

{% block title %}
    Вхід — LinkUp
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Вхід</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Увійти
        </button>

    </form>

    <p>
        Немає акаунта?

        <a href="{% url 'register' %}">
            Зареєструватися
        </a>
    </p>

</div>

{% endblock %}
