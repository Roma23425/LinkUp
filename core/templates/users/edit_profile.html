{% extends "base.html" %}

{% block title %}
    Редагування профілю
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        Редагування профілю
    </h1>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Зберегти
        </button>

    </form>

</div>

{% endblock %}
